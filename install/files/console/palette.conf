# The CDL palette. One file; every other themed surface is generated from it.
#
# Spec §9.7: "One palette, defined once, applied everywhere it can be." Sixteen ANSI
# colours plus a foreground and a background, consumed by kmscon, the kernel VT
# (setvtrgb), zsh, zellij, bat/eza/delta and the dashboard's CSS. Regenerate every
# consumer with `cdl-palette-apply` after editing this file, and re-check it with
# `cdl-palette-check` -- which the test suite runs, because §9.7 also says contrast is
# checked rather than assumed.
#
# THE ACCENT IS THE LAB'S REAL BRAND GREEN. #00703c is the dominant colour of the CDL
# avatar and the accent in context-lab.com's stylesheet. It is used for the prompt
# accent, the zellij frame and the dashboard's --cdl-accent.
#
# Open item 7 in the spec covers the logo, not this palette; the logo now exists and is
# fetched at install time. The scheme below is "cdl-default": built around the brand
# green rather than around a guess.
#
# TWO NUMBERS THAT WERE MEASURED, NOT CHOSEN, and that constrain any edit:
#
#   * The brand green #00703c is 2.99:1 against a #0d1512 background -- it FAILS the
#     3:1 gate by one hundredth. The background here is #0b1210 precisely so the real
#     brand colour clears it (3.05:1). Lightening the background breaks the accent.
#
#   * color0 ("black") is a lifted slate, not black. A true black on a dark background
#     is invisible: the archived design shipped an ANSI black at 1.24:1 while claiming
#     every colour cleared 4.5:1, which is the failure §9.7 cites. #606864 is 3.30:1.
#
# Format: KEY=#rrggbb, one per line. Anything else is ignored.

background=#0b1210
foreground=#d7e3dc

# The brand green. Not an ANSI slot: an accent, used where one colour must be "the"
# colour -- prompt marker, zellij frame, dashboard accent.
accent=#00703c

# normal
color0=#606864
color1=#e05561
color2=#2f9d68
color3=#d8a657
color4=#4d9be6
color5=#c678dd
color6=#3fb8af
color7=#c4cfc9

# bright
color8=#7c8480
color9=#ff7b86
color10=#4fc98a
color11=#f2c96b
color12=#7ab8ff
color13=#dda0ec
color14=#5fd7cd
color15=#eef4f1
